<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dbe8ec">
<title>쿠키와 친해지기</title>
<meta name="description" content="세상에서 제일 귀여운 고양이 쿠키와 친해지는 작은 게임. 쓰다듬고 츄르를 주면 호감도가 올라가요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #e4eef1;
    --card: #ffffff;
    --ink: #27313a;
    --mute: #6b7881;
    --line: #d9e4e8;
    --rose: #f28aa0;
    --rose-d: #e3637f;
    --gold: #f5c542;
    --gold-d: #e0a517;
    --sky: #bfe0ec;
    --display: "Jua", "Noto Sans KR", system-ui, sans-serif;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100svh;
    background:
      radial-gradient(900px 500px at 15% -10%, #f6fbfc 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 10%, #f9e9ea 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px; line-height: 1.7;
  }
  .page { max-width: 480px; margin: 0 auto; padding: 16px 14px 72px; }

  .brand { display: flex; align-items: baseline; gap: 10px; padding: 6px 6px 14px; }
  .brand h1 { margin: 0; font: 400 34px/1 var(--display); letter-spacing: -0.01em; }
  .brand p { margin: 0; color: var(--mute); font-size: 14px; }

  .game {
    position: relative; background: var(--card); border-radius: 28px; overflow: hidden;
    box-shadow: 0 1px 0 #fff inset, 0 18px 40px -18px rgba(44, 74, 88, .35), 0 2px 6px rgba(44, 74, 88, .08);
  }

  /* 호감도 */
  .hud { padding: 16px 18px 14px; }
  .hud-top { display: flex; align-items: center; gap: 10px; }
  .hud-heart { width: 26px; height: 26px; flex: none; }
  .gaining .hud-heart { animation: beat .55s ease-in-out infinite; }
  .hud-title { font-weight: 700; font-size: 15px; }
  .stage { font-size: 12.5px; font-weight: 500; color: var(--rose-d); background: #fde9ee; padding: 2px 10px; border-radius: 999px; }
  .pct { margin-left: auto; font: 400 30px/1 var(--display); font-variant-numeric: tabular-nums; }
  .gauge {
    position: relative; display: flex; height: 16px; margin-top: 10px;
    background: #e9f0f2; border-radius: 999px; overflow: hidden;
    box-shadow: inset 0 2px 3px rgba(44, 74, 88, .14);
  }
  .seg { height: 100%; width: 0; }
  .seg.pet { background: linear-gradient(180deg, #f9b2c1, var(--rose)); }
  .seg.churu { background: linear-gradient(180deg, #fbdc7c, var(--gold)); }
  .seg::after { content: ""; display: block; height: 40%; margin: 2px 6px 0; border-radius: 99px; background: rgba(255,255,255,.45); }
  .tick { position: absolute; top: 3px; bottom: 3px; width: 2px; margin-left: -1px; background: rgba(255,255,255,.9); border-radius: 2px; }
  .legend { display: flex; gap: 16px; margin-top: 9px; font-size: 13px; color: var(--mute); }
  .legend b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.pet { background: var(--rose); }
  .dot.churu { background: var(--gold); }

  /* 장면 */
  .scene { position: relative; aspect-ratio: 4 / 5; touch-action: none; cursor: none; user-select: none; -webkit-user-select: none; outline: none; background: #d9e8ec; }
  .scene:focus-visible { box-shadow: inset 0 0 0 3px var(--rose-d); }
  .scene svg { display: block; width: 100%; height: 100%; }
  .bubble {
    position: absolute; left: 50%; top: 14px; transform: translate(-50%, -8px) scale(.96);
    max-width: 82%; padding: 9px 16px; border-radius: 18px;
    background: #fff; color: var(--ink); font-weight: 500; font-size: 15px; line-height: 1.45; text-align: center;
    box-shadow: 0 6px 16px -6px rgba(44, 74, 88, .35);
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; width: 14px; height: 14px; margin-left: -7px;
    background: #fff; transform: rotate(45deg); border-radius: 3px;
  }
  .coach {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; pointer-events: none;
    font-size: 14px; color: #3a4a54; transition: opacity .4s;
  }
  .coach span { display: inline-block; padding: 6px 14px; background: rgba(255,255,255,.85); border-radius: 999px; backdrop-filter: blur(4px); }
  .coach.gone { opacity: 0; }

  /* 도구 */
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 14px 6px; }
  .tool {
    position: relative; display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 10px 14px; border-radius: 18px; border: 2px solid var(--line); background: #fff; color: var(--ink);
    font: 700 16px/1.2 var(--sans); cursor: pointer; transition: background .2s, border-color .2s, transform .1s;
  }
  .tool svg { width: 40px; height: 40px; flex: none; }
  .tool small { display: block; margin-top: 3px; font-weight: 400; font-size: 12px; color: var(--mute); }
  .tool:active { transform: scale(.98); }
  .tool:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .tool[aria-pressed="true"][data-tool="hand"] { border-color: var(--rose); background: #fff1f4; }
  .tool[aria-pressed="true"][data-tool="churu"] { border-color: var(--gold); background: #fff8e3; }
  .pouch-bar { position: absolute; left: 14px; right: 14px; bottom: 6px; height: 4px; border-radius: 4px; background: #efe9d4; overflow: hidden; }
  .pouch-bar i { display: block; height: 100%; width: 100%; background: var(--gold-d); border-radius: 4px; }
  .help { margin: 0; padding: 8px 20px 18px; font-size: 13.5px; color: var(--mute); text-align: center; min-height: 3.2em; }

  /* 완주 화면 */
  .win {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(255,255,255,.78); backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .5s;
  }
  .win.show { opacity: 1; pointer-events: auto; }
  .win-card { width: 100%; max-width: 340px; text-align: center; background: #fff; border-radius: 26px; padding: 26px 22px 22px; box-shadow: 0 20px 50px -20px rgba(44,74,88,.5); transform: translateY(14px) scale(.97); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .win.show .win-card { transform: none; }
  .win h2 { margin: 6px 0 4px; font: 400 36px/1.15 var(--display); }
  .win p { margin: 0; color: var(--mute); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
  .stats div { background: #f4f8f9; border-radius: 14px; padding: 10px 4px; }
  .stats b { display: block; font: 400 22px/1.2 var(--display); font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: var(--mute); }
  .best { font-size: 13px; margin-bottom: 14px !important; }
  .btns { display: grid; gap: 8px; }
  .btn { padding: 13px 16px; border-radius: 999px; border: 0; font: 700 16px/1.2 var(--sans); cursor: pointer; }
  .btn.main { background: var(--rose); color: #fff; box-shadow: 0 4px 0 var(--rose-d); }
  .btn.main:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rose-d); }
  .btn.sub { background: #eef4f6; color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* 소개 */
  .about { margin-top: 22px; padding: 26px 22px 24px; background: rgba(255,255,255,.7); border-radius: 28px; }
  .about h2 { margin: 0; font: 400 28px/1.2 var(--display); }
  .about .tag { margin: 6px 0 18px; font-size: 17px; }
  .likes { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .likes li { background: #fff; border-radius: 18px; padding: 14px 6px 12px; text-align: center; font-weight: 500; font-size: 14px; line-height: 1.35; box-shadow: 0 6px 14px -10px rgba(44,74,88,.45); }
  .likes svg { display: block; width: 44px; height: 44px; margin: 0 auto 8px; }
  .about h3 { margin: 20px 0 10px; font-size: 14px; font-weight: 500; color: var(--mute); }

  /* 고양이 동작 */
  #cat { --earL: -4deg; --earR: 4deg; --tailDur: 3.4s; }
  #cat.m0 { --earL: -14deg; --earR: 14deg; --tailDur: 5.2s; }
  #cat.m1 { --earL: -8deg; --earR: 8deg; --tailDur: 4.2s; }
  #cat.m2 { --earL: -3deg; --earR: 3deg; --tailDur: 3.2s; }
  #cat.m3 { --earL: 0deg; --earR: 0deg; --tailDur: 2.4s; }
  #cat.m4 { --earL: 2deg; --earR: -2deg; --tailDur: 1.7s; }
  #cat.alert { --earL: 4deg; --earR: -4deg; }
  #cat.happy, #cat.licking { --tailDur: 0.9s; }

  .tail { transform-origin: 208px 300px; animation: sway var(--tailDur) ease-in-out infinite alternate; }
  .body { transform-origin: 160px 324px; animation: breathe 3.6s ease-in-out infinite; }
  .headIn { transform-origin: 160px 200px; animation: bob 3.6s ease-in-out infinite; }
  .earL { transform-origin: 104px 92px; transform: rotate(var(--earL)); transition: transform .3s; }
  .earR { transform-origin: 216px 92px; transform: rotate(var(--earR)); transition: transform .3s; }
  .earL.twitch { animation: twitchL .32s ease-in-out; }
  .earR.twitch { animation: twitchR .32s ease-in-out; }
  .lid { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); }
  .blink .lid { animation: lid .2s ease-in-out; }
  .eyesHappy, .mouthOpen, .blush { opacity: 0; transition: opacity .25s; }
  #cat.happy .eyesHappy, #cat.licking .eyesHappy, #cat.win .eyesHappy { opacity: 1; }
  #cat.happy .eyesOpen, #cat.licking .eyesOpen, #cat.win .eyesOpen { opacity: 0; }
  #cat.happy .blush, #cat.licking .blush, #cat.win .blush, #cat.m3 .blush, #cat.m4 .blush { opacity: .75; }
  #cat.licking .mouthOpen { opacity: 1; }
  #cat.licking .mouthClosed { opacity: 0; }
  .tongue { transform-box: fill-box; transform-origin: 50% 0; }
  #cat.licking .tongue { animation: lick .42s ease-in-out infinite; }
  #cat.happy .headIn { animation: purr .15s linear infinite; }
  #cat.win { animation: hop .62s ease-in-out infinite; }

  .fxIn { animation: rise 1.5s ease-out forwards; }
  .fxText { animation: riseText 1.2s ease-out forwards; }
  .spark { animation: spark .7s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  .pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.4); }
  .fadein { animation: fadein .5s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(10deg); } }
  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.014); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
  @keyframes purr { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(.8px, -.6px); } 50% { transform: translate(-.7px, .6px); } 75% { transform: translate(.6px, .7px); } }
  @keyframes twitchL { 0%, 100% { transform: rotate(var(--earL)); } 40% { transform: rotate(calc(var(--earL) - 12deg)); } }
  @keyframes twitchR { 0%, 100% { transform: rotate(var(--earR)); } 40% { transform: rotate(calc(var(--earR) + 12deg)); } }
  @keyframes lid { 0%, 100% { transform: scaleY(0); } 45%, 55% { transform: scaleY(1.02); } }
  @keyframes lick { 0%, 100% { transform: scale(1, .55); } 50% { transform: scale(1.08, 1.5); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  @keyframes rise { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 0), -92px) scale(1.15); } }
  @keyframes riseText { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px); } }
  @keyframes spark { 0% { opacity: 1; transform: scale(.3) rotate(0); } 100% { opacity: 0; transform: scale(1.4) rotate(90deg); } }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
  @keyframes dust { 0%, 100% { transform: translate(0, 0); opacity: .0; } 20%, 80% { opacity: .8; } 50% { transform: translate(8px, -14px); } }
  .dust circle { animation: dust 7s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .tail, .body, .headIn, .dust circle { animation: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="brand">
    <h1>쿠키</h1>
    <p>세상에서 제일 귀여운 고양이</p>
  </div>

  <section class="game" id="game" aria-label="쿠키와 친해지기">

    <div class="hud" id="hud">
      <div class="hud-top">
        <svg class="hud-heart" viewBox="-16 -16 32 32" aria-hidden="true"><path d="M0 12 C-18 -1 -14 -15 -6 -15 C-2 -15 0 -12 0 -10 C0 -12 2 -15 6 -15 C14 -15 18 -1 0 12 Z" fill="#f28aa0"/><path d="M-8 -9 C-11 -8 -11 -4 -9 -2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/></svg>
        <span class="hud-title">호감도</span>
        <span class="stage" id="stage">경계 중</span>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="gauge" id="gauge" role="progressbar" aria-label="호감도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="seg pet" id="segPet"></div>
        <div class="seg churu" id="segChuru"></div>
        <i class="tick" style="left:20%"></i><i class="tick" style="left:40%"></i><i class="tick" style="left:60%"></i><i class="tick" style="left:80%"></i>
      </div>
      <div class="legend">
        <span><i class="dot pet"></i>쓰다듬기 <b id="lgPet">0%</b></span>
        <span><i class="dot churu"></i>츄르 <b id="lgChuru">0%</b></span>
      </div>
    </div>

    <div class="scene" id="scene" tabindex="0" role="application" aria-label="쿠키가 있는 방. 화살표 키로 도구를 움직이고 스페이스 바를 누르고 있으면 쓰다듬거나 츄르를 줄 수 있어요.">
      <svg id="svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3eff2"/><stop offset="1" stop-color="#cfe1e6"/></linearGradient>
          <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efd9bd"/><stop offset="1" stop-color="#e2c4a0"/></linearGradient>
          <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f3"/><stop offset="1" stop-color="#eaf7fc"/></linearGradient>
          <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7da" stop-opacity=".75"/><stop offset="1" stop-color="#fff7da" stop-opacity="0"/></linearGradient>
          <linearGradient id="furG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c0c5"/><stop offset="1" stop-color="#9fa7ad"/></linearGradient>
          <radialGradient id="irisG" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#f1ee8c"/><stop offset=".65" stop-color="#cfca55"/><stop offset="1" stop-color="#a9a53a"/></radialGradient>
          <linearGradient id="heartG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa6b8"/><stop offset="1" stop-color="#ef6f8c"/></linearGradient>
          <linearGradient id="pasteG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9c79e"/><stop offset="1" stop-color="#eea577"/></linearGradient>
          <linearGradient id="labelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb0d6"/><stop offset="1" stop-color="#2f86b5"/></linearGradient>
          <radialGradient id="cushionG" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#f6cbc8"/><stop offset="1" stop-color="#e7a9a8"/></radialGradient>
          <clipPath id="winClip"><path d="M26 236 V118 C26 92 44 78 78 78 C112 78 130 92 130 118 V236 Z"/></clipPath>
        </defs>

        <!-- 방 -->
        <rect width="400" height="500" fill="url(#wallG)"/>
        <rect y="372" width="400" height="128" fill="url(#floorG)"/>
        <path d="M0 372 H400" stroke="#fff" stroke-opacity=".55" stroke-width="6"/>
        <path d="M0 410 H400 M0 450 H400 M120 372 L96 500 M250 372 L262 500 M330 372 L372 500" stroke="#c9a67c" stroke-opacity=".35" stroke-width="1.6"/>

        <!-- 창문과 햇살 -->
        <path d="M26 236 V118 C26 92 44 78 78 78 C112 78 130 92 130 118 V236 Z" fill="#fff"/>
        <g clip-path="url(#winClip)">
          <rect x="26" y="70" width="104" height="170" fill="url(#skyG)"/>
          <circle cx="104" cy="120" r="26" fill="#fff" opacity=".55"/>
          <ellipse cx="52" cy="160" rx="26" ry="9" fill="#fff" opacity=".85"/>
          <ellipse cx="66" cy="154" rx="18" ry="9" fill="#fff" opacity=".85"/>
        </g>
        <path d="M26 236 V118 C26 92 44 78 78 78 C112 78 130 92 130 118 V236 Z" fill="none" stroke="#f9f6f1" stroke-width="7"/>
        <path d="M78 78 V236 M26 160 H130" stroke="#f9f6f1" stroke-width="5"/>
        <rect x="18" y="234" width="120" height="9" rx="4" fill="#f4efe7"/>
        <path d="M30 244 L130 244 L336 500 L120 500 Z" fill="url(#beamG)"/>
        <g class="dust" fill="#fff8e1">
          <circle cx="120" cy="300" r="2.2" style="animation-delay:-1s"/><circle cx="158" cy="352" r="1.8" style="animation-delay:-3s"/>
          <circle cx="96" cy="340" r="1.6" style="animation-delay:-5s"/><circle cx="226" cy="420" r="2" style="animation-delay:-2s"/>
        </g>

        <!-- 화분 -->
        <g transform="translate(332,268)">
          <path d="M-8 100 C-26 70 -34 44 -22 24 C-14 40 -8 66 -4 98 Z" fill="#8cc59b"/>
          <path d="M2 100 C-6 60 4 30 20 12 C22 40 14 74 8 100 Z" fill="#6fb384"/>
          <path d="M10 102 C22 84 40 74 52 76 C46 94 30 104 12 106 Z" fill="#9fd1a9"/>
          <path d="M-30 100 H42 L36 150 C35 158 -23 158 -24 150 Z" fill="#f2d7cf"/>
          <rect x="-34" y="94" width="80" height="14" rx="7" fill="#ecc7bd"/>
        </g>
        <!-- 상자 -->
        <g transform="translate(18,408)">
          <path d="M0 14 L84 14 L92 74 L-6 74 Z" fill="#d7b387"/>
          <path d="M0 14 L-14 -2 L40 -6 L42 14 Z" fill="#e4c59b"/>
          <path d="M84 14 L100 0 L52 -6 L42 14 Z" fill="#cfa87a"/>
          <rect x="30" y="38" width="30" height="8" rx="4" fill="#b88f60" opacity=".6"/>
        </g>

        <!-- 러그와 방석 -->
        <ellipse cx="200" cy="452" rx="168" ry="30" fill="#f6e3dc"/>
        <ellipse cx="200" cy="452" rx="168" ry="30" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity=".9"/>
        <ellipse cx="200" cy="446" rx="112" ry="22" fill="#cf9b98" opacity=".5"/>
        <ellipse cx="200" cy="440" rx="112" ry="23" fill="url(#cushionG)"/>

        <!-- 쿠키 -->
        <g transform="translate(40,128)">
          <g id="cat" class="m0">

            <g class="tail">
              <path d="M208 300 C292 312 312 246 284 204" fill="none" stroke="#a3abb0" stroke-width="28" stroke-linecap="round"/>
              <path d="M208 300 C292 312 312 246 284 204" fill="none" stroke="#6c757b" stroke-width="28" stroke-dasharray="11 21" stroke-dashoffset="-4"/>
              <circle cx="284" cy="204" r="14" fill="#4a5258"/>
            </g>

            <g class="body">
              <path d="M98 196 C66 248 78 320 160 324 C242 320 254 248 222 196 Z" fill="url(#furG)"/>
              <g stroke="#6c757b" stroke-width="6" fill="none" stroke-linecap="round" opacity=".75">
                <path d="M96 228 C88 256 90 286 104 304"/><path d="M104 214 C102 236 102 252 108 266"/>
                <path d="M224 228 C232 256 230 286 216 304"/><path d="M216 214 C218 236 218 252 212 266"/>
              </g>
              <ellipse cx="160" cy="270" rx="44" ry="56" fill="#f6f7f7"/>
              <path d="M112 262 C110 290 110 304 114 316 H150 C152 302 152 284 150 262 Z" fill="url(#furG)"/>
              <path d="M208 262 C210 290 210 304 206 316 H170 C168 302 168 284 170 262 Z" fill="url(#furG)"/>
              <g stroke="#6c757b" stroke-width="5" stroke-linecap="round" opacity=".85">

  function toScene(e) {
    var r = svg.getBoundingClientRect();

  }
  function overCat(x, y) {
    var a = (x - 200) / 118, b = (y - 262) / 100;
    var c = (x - 200) / 92, d = (y - 392) / 72;

  }
  function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

    P.down = false;

  scene.addEventListener("keydown", function (e) {

    g.appendChild(inner); fx.appendChild(g); remove(g, 1600);
  }
  function sparkle(x, y) {
    var g = el("g", { transform: "translate(" + x + " " + y + ")" });
    g.appendChild(el("path", { "class": "spark", d: "M0 -9 L2.4 -2.4 L9 0 L2.4 2.4 L0 9 L-2.4 2.4 L-9 0 L-2.4 -2.4 Z", fill: "#f8cf4a" }));

  }
  function floatText(x, y, text) {

  }
  function say(text, ms) {
    bubble.textContent = text; bubble.classList.add("show");

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  /* ---------- 게임 진행 ---------- */
  function total() { return S.pet + S.churu; }
  function addLove(kind, amount) {
    var room = 100 - total();
    amount = Math.min(amount, room);
    if (amount <= 0) return;
    S[kind] += amount;
  }
  function stageOf(v) { return v >= 100 ? 5 : Math.min(4, Math.floor(v / 20)); }

  function renderHud() {
    var t = total(), pet = S.pet, ch = S.churu;
    segPet.style.width = pet + "%";
    segChuru.style.width = ch + "%";
    var shown = t >= 99.95 ? 100 : Math.floor(t);
    pctEl.textContent = shown + "%";
    gauge.setAttribute("aria-valuenow", String(shown));
    lgPet.textContent = Math.round(pet) + "%";
    lgChuru.textContent = Math.round(ch) + "%";
    stageEl.textContent = STAGE[S.stage];
    pouchBar.style.width = S.pouch + "%";
  }

  function setClass(name, on) {
    if (flags[name] === on) return;
    flags[name] = on;
    cat.classList.toggle(name, on);
  }

  function onStage(n) {
    S.stage = n;
    for (var i = 0; i < 5; i++) cat.classList.remove("m" + i);
    cat.classList.add("m" + Math.min(4, n));
    if (n > 0) {
      say(MSG[n], 3200);
      buzz(30);
      for (var k = 0; k < 6; k++) setTimeout(function () { sparkle(200 + (Math.random() * 160 - 80), 230 + Math.random() * 100); }, k * 70);
      stageEl.classList.remove("pop"); void stageEl.getBoundingClientRect(); stageEl.classList.add("pop");
    }
  }

  function win() {
    S.done = true;
    var elapsed = (performance.now() - S.startedAt) / 1000;
    setClass("win", true);
    say(MSG[5], 4000);
    for (var i = 0; i < 28; i++) {
      (function (i) { setTimeout(function () { heart(70 + Math.random() * 260, 230 + Math.random() * 160, true); if (i % 3 === 0) sparkle(60 + Math.random() * 280, 200 + Math.random() * 200); }, i * 90); })(i);
    }
    buzz([60, 40, 60]);
    var best = null;
    try { best = parseFloat(localStorage.getItem(bestKey)); } catch (e) {}
    var isBest = !(best > 0) || elapsed < best;
    if (isBest) { try { localStorage.setItem(bestKey, String(elapsed)); } catch (e) {} best = elapsed; }
    $("stTime").textContent = fmt(elapsed);
    $("stPet").textContent = Math.round(S.pet) + "%";
    $("stChuru").textContent = Math.round(S.churu) + "%";
    $("best").textContent = (isBest ? "새 최고 기록이에요! " : "") + "최고 기록 " + fmt(best);
    setTimeout(function () { winEl.classList.add("show"); winEl.setAttribute("aria-hidden", "false"); $("again").focus(); }, 1700);
  }

  function reset() {
    S.pet = 0; S.churu = 0; S.pouch = 100; S.reload = 0; S.done = false; S.started = false; S.startedAt = 0;
    setClass("win", false);
    winEl.classList.remove("show"); winEl.setAttribute("aria-hidden", "true");
    onStage(0); S.stage = 0; cat.classList.remove("m1", "m2", "m3", "m4"); cat.classList.add("m0");
    coach.classList.remove("gone");
    bubble.classList.remove("show");
    renderHud(); updateHelp();
    scene.focus({ preventScroll: true });
  }
  $("again").addEventListener("click", reset);
  $("keep").addEventListener("click", function () { winEl.classList.remove("show"); winEl.setAttribute("aria-hidden", "true"); scene.focus({ preventScroll: true }); });

  /* ---------- 매 프레임 ---------- */
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    var active = P.inside && (P.type === "mouse" || P.down);
    var tip = active || (P.inside && P.type === "mouse") ? { x: P.x, y: P.y } : null;

    var stroking = false, licking = false;
    if (S.tool === "hand") {
      stroking = !!tip && active && overCat(P.x, P.y) && (t - P.lastMove) < 220;
    } else {
      var near = tip ? dist(P.x, P.y, MOUTH.x + 8, MOUTH.y + 12) : 999;
      licking = !!tip && active && near < 62 && S.pouch > 0 && S.reload <= 0;
    }
    var gaining = false;
    if (!S.done) {
      if (stroking || licking) {
        if (!S.started) { S.started = true; S.startedAt = t; coach.classList.add("gone"); }
        addLove(stroking ? "pet" : "churu", GAIN_PER_SEC * dt);
        gaining = true;
      }
      if (licking) {
        S.pouch = Math.max(0, S.pouch - (100 / POUCH_SEC) * dt);
        if (S.pouch <= 0) { S.reload = 0.9; floatText(MOUTH.x, MOUTH.y - 40, "다 먹었어!"); }
      }
    }
    if (S.reload > 0) {
      S.reload -= dt;
      if (S.reload <= 0) { S.pouch = 100; churuIn.classList.remove("fadein"); void churuIn.getBoundingClientRect(); churuIn.classList.add("fadein"); }
    }

    var st = stageOf(total());
    if (st > S.stage && !S.done) onStage(st);
    if (total() >= 99.999 && !S.done) { renderHud(); win(); }

    game.classList.toggle("gaining", gaining);
    renderHud();

    // 파티클
    if (stroking) {
      timers.heart -= dt;
      if (timers.heart <= 0) { timers.heart = 0.42; heart(P.x + (Math.random() * 40 - 20), P.y - 40); if (Math.random() < .4) floatText(P.x + 40, P.y - 70, ["그르릉~", "으음~", "거기거기"][Math.floor(Math.random() * 3)]); }
    }
    if (licking) {
      timers.text -= dt;
      if (timers.text <= 0) { timers.text = 0.7; floatText(MOUTH.x + (Math.random() * 60 - 30), MOUTH.y - 48, ["냠냠", "쩝쩝", "맛있다!"][Math.floor(Math.random() * 3)]); heart(MOUTH.x + (Math.random() * 80 - 40), MOUTH.y - 30); }
      if (Math.random() < dt * 5) sparkle(MOUTH.x + (Math.random() * 50 - 25), MOUTH.y + 6 + Math.random() * 20);
    }

    // 고양이 상태
    var alert = S.tool === "churu" && !!tip && dist(P.x, P.y, MOUTH.x, MOUTH.y) < 190 && S.pouch > 0;
    setClass("happy", stroking);
    setClass("licking", licking);
    setClass("alert", alert && !licking);

    // 머리와 눈이 도구를 따라가요
    var tx = 0, ty = 0, tr = 0, pxT = 0, pyT = 0, ps = S.stage === 0 ? 1.12 : 1;
    if (P.inside) {
      var dx = clamp((P.x - 200) / 200, -1, 1), dy = clamp((P.y - 262) / 240, -1, 1);
      tx = dx * 5; tr = dx * 5; ty = dy * 2;
      pxT = dx * 8; pyT = dy * 6;
      if (alert) { ty -= 5; ps = 1.22; }
      if (stroking) { ty += 7; tr = dx * 7; }
      if (licking) { ty -= 7; tr = dx * 3; }
    }
    if (S.done) { ty -= 2; }
    var k = 1 - Math.exp(-dt * 12);
    anim.hx += (tx - anim.hx) * k; anim.hy += (ty - anim.hy) * k; anim.hr += (tr - anim.hr) * k;
    anim.px += (pxT - anim.px) * k; anim.py += (pyT - anim.py) * k; anim.ps += (ps - anim.ps) * k;
    head.setAttribute("transform", "translate(" + anim.hx.toFixed(2) + " " + anim.hy.toFixed(2) + ") rotate(" + anim.hr.toFixed(2) + " 160 200)");
    var pt = "translate(" + anim.px.toFixed(2) + " " + anim.py.toFixed(2) + ") scale(" + anim.ps.toFixed(3) + ")";
    pupilL.setAttribute("transform", pt); pupilR.setAttribute("transform", pt);

    // 눈 깜빡임, 귀 쫑긋
    timers.blink -= dt;
    if (timers.blink <= 0) {
      timers.blink = 2 + Math.random() * 3.5;
      cat.classList.add("blink"); setTimeout(function () { cat.classList.remove("blink"); }, 220);
    }
    timers.twitch -= dt;
    if (timers.twitch <= 0) {
      timers.twitch = 3 + Math.random() * 5;
      var ear = Math.random() < .5 ? earL : earR;
      ear.classList.remove("twitch"); void ear.getBoundingClientRect(); ear.classList.add("twitch");
    }

    // 도구 스프라이트
    var showTool = P.inside;
    var goalX = showTool ? P.x : PARK.x, goalY = showTool ? P.y : PARK.y;
    var kt = 1 - Math.exp(-dt * (showTool ? 22 : 8));
    var px0 = anim.tx;
    anim.tx += (goalX - anim.tx) * kt; anim.ty += (goalY - anim.ty) * kt;
    var vx = (anim.tx - px0) / Math.max(dt, 0.001);
    anim.rot += (clamp(vx * 0.02, -14, 14) - anim.rot) * (1 - Math.exp(-dt * 10));

    if (S.tool === "hand") {
      var wob = stroking ? Math.sin(t / 70) * 2.2 : 0;
      handG.setAttribute("transform", "translate(" + (anim.tx + wob).toFixed(1) + " " + (anim.ty - 8).toFixed(1) + ") rotate(" + anim.rot.toFixed(1) + ") scale(" + (stroking ? 0.74 : 0.8) + ")");
      churuG.setAttribute("transform", "translate(" + PARK.x + " " + PARK.y + ")");
    } else {
      var jig = licking ? Math.sin(t / 55) * 1.6 : 0;
      var scale = 0.78;
      churuG.setAttribute("transform", "translate(" + (anim.tx + 14).toFixed(1) + " " + (anim.ty + 18 + jig).toFixed(1) + ") scale(" + scale + ")");
      handG.setAttribute("transform", "translate(" + PARK.x + " " + PARK.y + ")");
      var p = S.reload > 0 ? 0 : S.pouch / 100;
      paste.setAttribute("transform", "scale(" + (0.25 + 0.75 * p).toFixed(3) + ")");
      paste.style.opacity = S.reload > 0 ? 0 : 1;
      fillRect.setAttribute("transform", "scale(" + Math.max(0.02, p).toFixed(3) + " 1)");
    }

    requestAnimationFrame(frame);
  }

  /* ---------- 시작 ---------- */
  cat.classList.add("m0");
  setTool("hand");
  renderHud();
  updateHelp();
  setTimeout(function () { say(MSG[0], 3400); }, 700);
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아가 귀여워(파란 버전)</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #eef6ff; color: #222; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 60px 20px; }
    .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h1 { margin: 0 0 8px; color: #2563eb; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    ul { margin: 0; padding-left: 20px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>아가 귀여워(파란 버전)</h1>
      <p>너무너무 귀엽습니다</p>
    </div>
    <div class="card">
      <h2>관심사</h2>
      <ul>
        <li>정후</li>
        <li>인스타</li>
        <li>동생 연애</li>
      </ul>
    </div>
  </div>
</body>
</html>

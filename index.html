<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿠키</title>
<meta name="description" content="세상에서 제일 귀여운 고양이, 쿠키.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
  :root {
    --fog: #e9edee;
    --paper: #f6f8f7;
    --ink: #1b2226;
    --mute: #5a666c;
    --line: #c2cbce;
    --eye: #a9a23a;
    --rose: #c98d89;
    --serif: "Noto Serif KR", "Apple SD Gothic Neo", "Batang", serif;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fog);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 17px;
    line-height: 1.75;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 20px 96px; }

  /* 첫 화면: 사진과 이름 */
  .hero { display: grid; gap: 28px; align-items: center; }
  @media (min-width: 880px) {
    .wrap { padding-top: 48px; }
    .hero { grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr); gap: 72px; }
  }

  .frame {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #cdd5d8;
    border-radius: 2px;
    cursor: grab;
    touch-action: pan-y;
    -webkit-tap-highlight-color: transparent;
    animation: arrive 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .frame:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .drift { position: absolute; inset: 0; animation: drift 20s ease-in-out infinite alternate; }
  .drift img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; user-select: none; -webkit-user-drag: none;
    transition: opacity 0.9s ease;
  }
  .drift img.alt { opacity: 0; }
  .frame.alt-on .drift img.alt { opacity: 1; }
  .frame.happy .drift { animation: purr 0.16s linear infinite; filter: brightness(1.04) saturate(1.06); }

  .churu {
    position: absolute; left: 54%; top: 31%; width: 36%;
    transform: translateX(150%) rotate(-12deg);
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    pointer-events: none;
  }
  .frame.feeding .churu { transform: translateX(0) rotate(-12deg); }
  .churu .drop { opacity: 0; }
  .frame.feeding .churu .drop { animation: drip 1.2s ease-in 0.7s infinite; }

  .heart {
    position: absolute; color: var(--rose); font-size: 22px; line-height: 1;
    pointer-events: none; animation: rise 1.5s ease-out forwards;
  }

  .caption {
    margin: 14px 0 0; min-height: 1.75em;
    font-family: var(--serif); font-weight: 300; font-size: 16px; color: var(--mute);
  }

  h1 {
    margin: 0;
    font-family: var(--serif); font-weight: 300;
    font-size: clamp(76px, 17vw, 148px); line-height: 1; letter-spacing: -0.03em;
  }
  .tagline {
    margin: 18px 0 0;
    font-family: var(--serif); font-weight: 300;
    font-size: clamp(20px, 3.4vw, 26px); line-height: 1.5;
  }
  .hint { margin: 10px 0 0; color: var(--mute); font-size: 15px; }

  .meters { margin-top: 36px; display: grid; gap: 18px; }
  .meter { display: grid; grid-template-columns: 1fr auto; row-gap: 8px; font-size: 15px; }
  .meter .bar { grid-column: 1 / -1; position: relative; height: 2px; background: var(--line); }
  .meter .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); transition: width 0.6s ease; }
  .meter.love .bar i { background: var(--rose); }

  .actions { margin-top: 28px; display: flex; gap: 12px; }
  .btn {
    flex: 1; padding: 13px 18px;
    font: 400 16px/1.2 var(--sans); letter-spacing: 0.02em;
    color: var(--ink); background: transparent;
    border: 1px solid var(--ink); border-radius: 999px; cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: transparent; color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .btn[disabled] { opacity: 0.45; cursor: default; }

  .tally { margin: 18px 0 0; font-size: 14px; color: var(--mute); }

  /* 좋아하는 것 */
  section.block { margin-top: 112px; }
  h2 {
    margin: 0 0 24px;
    font-family: var(--serif); font-weight: 300;
    font-size: clamp(26px, 4vw, 34px); line-height: 1.3;
  }
  .likes { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .likes li {
    padding: 22px 0; border-bottom: 1px solid var(--line);
    font-family: var(--serif); font-size: clamp(20px, 3vw, 24px); font-weight: 300;
  }
  @media (min-width: 880px) {
    .likes-wrap { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 72px; align-items: start; }
    .likes-wrap h2 { margin: 0; position: sticky; top: 40px; }
  }

  /* 사진첩 */
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .gallery figure { margin: 0; position: relative; overflow: hidden; background: #cdd5d8; border-radius: 2px; min-height: 0; }
  .gallery img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .gallery .tall { grid-row: 1 / span 2; aspect-ratio: 3 / 4; }
  .gallery .tall img { object-position: 50% 30%; }
  .gallery .sit img { object-position: 50% 18%; }

  @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.035); } }
  @keyframes purr {
    0% { transform: translate(0, 0) scale(1.035); }
    25% { transform: translate(0.7px, -0.5px) scale(1.035); }
    50% { transform: translate(-0.6px, 0.5px) scale(1.035); }
    75% { transform: translate(0.5px, 0.6px) scale(1.035); }
    100% { transform: translate(0, 0) scale(1.035); }
  }
  @keyframes drip {
    0% { opacity: 0; transform: translateY(0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(54px); }
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(0.7); }
    18% { opacity: 0.95; }
    100% { opacity: 0; transform: translateY(-84px) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
(function () {
  var KEY = "cookie-cat-v2";
  var state = { full: 55, love: 30, pets: 0, feeds: 0 };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved) { state.pets = +saved.pets || 0; state.feeds = +saved.feeds || 0; }
  } catch (e) {}

  var frame = document.getElementById("frame");
  var caption = document.getElementById("caption");
  var fullBar = document.getElementById("fullBar");
  var loveBar = document.getElementById("loveBar");
  var fullNum = document.getElementById("fullNum");
  var loveNum = document.getElementById("loveNum");
  var feedBtn = document.getElementById("feedBtn");
  var petBtn = document.getElementById("petBtn");
  var tally = document.getElementById("tally");

  var eating = false, happyTimer = null, lastSay = 0;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ pets: state.pets, feeds: state.feeds })); } catch (e) {}
  }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function say(text, force) {
    var now = Date.now();
    if (!force && now - lastSay < 1500) return;
    lastSay = now;
    caption.textContent = text;
  }
  function render() {
    fullBar.style.width = state.full + "%";
    loveBar.style.width = state.love + "%";
    fullNum.textContent = state.full;
    loveNum.textContent = state.love;
    if (state.pets || state.feeds) {
      tally.textContent = "쓰다듬은 횟수 " + state.pets + "번, 츄르 준 횟수 " + state.feeds + "번";
    }
  }
  function heart() {
    var h = document.createElement("span");
    h.className = "heart";
    h.textContent = "♥";
    h.style.left = (30 + Math.random() * 40) + "%";
    h.style.top = (16 + Math.random() * 26) + "%";
    frame.appendChild(h);
    setTimeout(function () { if (h.parentNode) h.parentNode.removeChild(h); }, 1600);
  }

  function pet(isStroke) {
    if (eating) { say("지금은 츄르를 먹는 중이에요.", true); return; }
    state.love = Math.min(100, state.love + 4);
    state.pets += 1;
    frame.classList.add("happy");
    clearTimeout(happyTimer);
    happyTimer = setTimeout(function () { frame.classList.remove("happy"); }, 1800);
    heart();
    say(pick(["그르릉.", "눈을 천천히 깜빡여요.", "조금 더 쓰다듬어도 좋아요.", "기분이 좋아 보여요."]), !isStroke);
    render();
    save();
  }

  function feed() {
    if (eating) return;
    if (state.full >= 95) {
      say("배가 불러서 오늘은 여기까지예요.", true);
      return;
    }
    eating = true;
    feedBtn.disabled = true;
    frame.classList.remove("happy");
    frame.classList.add("feeding", "alt-on");
    say("츄르를 보고 눈이 커졌어요.", true);
    setTimeout(function () {
      frame.classList.remove("feeding");
      state.full = Math.min(100, state.full + 25);
      state.love = Math.min(100, state.love + 4);
      state.feeds += 1;
      heart();
      setTimeout(heart, 250);
      say("잘 먹었어요.", true);
      render();
      save();
      setTimeout(function () {
        frame.classList.remove("alt-on");
        eating = false;
        feedBtn.disabled = false;
      }, 900);
    }, 2400);
  }

  feedBtn.addEventListener("click", feed);
  petBtn.addEventListener("click", function () { pet(false); });
  frame.addEventListener("click", function () { pet(false); });
  frame.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pet(false); }
  });

  // 문지르듯 움직이면 쓰다듬기로 친다
  var lastX = null, lastY = null, dist = 0;
  frame.addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse" && e.buttons === 0 && e.pressure === 0) return;
    if (lastX !== null) dist += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    if (dist > 160) { dist = 0; pet(true); }
  });
  function resetStroke() { lastX = null; lastY = null; dist = 0; }
  frame.addEventListener("pointerleave", resetStroke);
  frame.addEventListener("pointerup", resetStroke);

  // 시간이 지나면 배가 고파지고 애정이 식는다
  setInterval(function () {
    if (eating) return;
    state.full = Math.max(0, state.full - 2);
    state.love = Math.max(0, state.love - 1);
    render();
    if (state.full < 25 && Math.random() < 0.5) say("배가 고픈 것 같아요.");
  }, 5000);

  render();
})();
</script>

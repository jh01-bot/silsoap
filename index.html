<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 소개 페이지</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f5f7fb; color: #222; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 60px 20px; }
    .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h1 { margin: 0 0 8px; color: #2d6cdf; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    ul { margin: 0; padding-left: 20px; line-height: 1.8; }
    a.btn { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #2d6cdf; color: #fff; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>안녕하세요, 내 이름입니다</h1>
      <p>한 줄 소개를 여기에 적어보세요.</p>
    </div>
    <div class="card">
      <h2>관심사</h2>
      <ul>
        <li>관심사 하나</li>
        <li>관심사 둘</li>
        <li>관심사 셋</li>
      </ul>
    </div>
    <div class="card">
      <h2>연락하기</h2>
      <p>아래 버튼은 나중에 진짜 링크로 바꿔요.</p>
      <a class="btn" href="#">연락하기</a>
    </div>
  </div>
</body>
</html>
